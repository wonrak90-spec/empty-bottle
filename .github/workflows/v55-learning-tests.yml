name: V55 Learning Store Tests

on:
  pull_request:
    paths:
      - 'v55-ocr-learning.js'
      - 'v55-ocr-learning-admin.js'
      - 'v55-ocr-learning-diagnostics.js'
      - 'v55-ocr-benchmark.js'
      - 'OCR_LEARNING_*.gs'
      - 'OCR_LEARNING_*.md'
      - 'OCR_LEARNING_*.py'
      - 'config.js'
      - 'sw.js'
      - 'tests/v55-learning.test.js'
      - 'tests/v55-learning-backend.test.js'
      - '.github/workflows/v55-learning-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard frozen V54 core
        shell: bash
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          bad=""
          image_bad=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              OCR_LEARNING_*.gs|OCR_LEARNING_*.md|OCR_LEARNING_*.py|v55-*.js|config.js|sw.js|tests/*|.github/workflows/v55-learning-tests.yml) ;;
              *) bad="${bad}${file}"$'\n' ;;
            esac
            case "$file" in
              *.png|*.jpg|*.jpeg|*.webp|*.gif|*.bmp|*.tif|*.tiff) image_bad="${image_bad}${file}"$'\n' ;;
            esac
          done <<< "$changed"
          if [ -n "$bad" ]; then
            echo "Frozen V54 core file changed:"
            printf "%s" "$bad"
            exit 1
          fi
          if [ -n "$image_bad" ]; then
            echo "Image files must not be committed for OCR Learning:"
            printf "%s" "$image_bad"
            exit 1
          fi

      - name: Run V55 regression tests
        run: node tests/v55-learning.test.js

      - name: Run V55 backend and metrics tests
        run: node tests/v55-learning-backend.test.js

      - name: Run OCR robustness release-gate tests
        run: python tests/v55-robustness-eval.test.py

      - name: Run Ground Truth linker tests
        run: python tests/v55-ground-truth-link.test.py

      - name: Run private dataset packager tests
        run: python tests/v55-dataset-pack.test.py

      - name: Run benchmark package contract tests
        run: python tests/v55-benchmark-format.test.py

      - name: Static check Apps Script modules
        run: |
          node --check v55-ocr-learning.js
          node --check v55-ocr-learning-admin.js
          node --check v55-ocr-learning-diagnostics.js
          node --check v55-ocr-benchmark.js
          cp OCR_LEARNING_STORE_V1.gs /tmp/ocr-learning-store.js
          cp OCR_LEARNING_ROUTER_V1.gs /tmp/ocr-learning-router.js
          node --check /tmp/ocr-learning-store.js
          node --check /tmp/ocr-learning-router.js
          python -m py_compile OCR_LEARNING_ROBUSTNESS_PREP_V1.py OCR_LEARNING_ROBUSTNESS_AUGMENT_V1.py OCR_LEARNING_ROBUSTNESS_EVAL_V1.py OCR_LEARNING_GROUND_TRUTH_LINK_V1.py OCR_LEARNING_DATASET_PACK_V1.py
          if grep -Eq 'DriveApp|data:image|base64' OCR_LEARNING_STORE_V1.gs OCR_LEARNING_ROUTER_V1.gs; then
            echo "Learning backend must reference existing photo URLs only."
            exit 1
          fi
