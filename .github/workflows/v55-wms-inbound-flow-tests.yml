name: V55 WMS Inbound Flow Tests

on:
  push:
    branches:
      - main
      - feature/v55-wms-inbound-flow-v1-20260924
      - feature/v56-fast-inbound-v1-20260930
      - release/v55-live-rc-20260928

jobs:
  inbound-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend syntax check
        run: |
          node --check app.js
          node --check v55-wms-inbound-progress.js
          node --check v55-wms-quality.js
          node --check v55-wms-parser.js
          node --check v55-vendor-parser.js
          node --check v55-adaptive-ocr.js
          node --check v55-roi-preprocess.js
          node --check v55-capture-assist.js
          node --check v56-fast-flow.js
      - name: Apps Script syntax check
        run: |
          cp Code.gs /tmp/Code.js
          node --check /tmp/Code.js
      - name: WMS inbound progress tests
        run: node tests/v55-wms-inbound-progress.test.js
      - name: WMS OCR quality guard tests
        run: node tests/v55-wms-quality.test.js
      - name: Close-up capture assist tests
        run: node tests/v55-capture-assist.test.js
      - name: V56 fast inbound flow tests
        run: node tests/v56-fast-flow.test.js
      - name: Live OCR UI preservation
        run: node tests/v55-live-ocr-ui.test.js
      - name: ROI preprocessing regression
        run: node tests/v55-roi-preprocess.test.js
      - name: Vendor parser regression
        run: node tests/v55-vendor-parser.test.js
      - name: WMS parser regression
        run: node tests/v55-wms-parser.test.js
      - name: Adaptive OCR regression
        run: node tests/v55-adaptive-ocr.test.js
