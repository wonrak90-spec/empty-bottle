<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>공병 입고 V26 OCR Test</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1b19;--muted:#6b6659;--line:#ddd7c8;--primary:#1f4b5f;--ok:#2e6f4e;--warn:#a6791f;--bad:#b2452f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;padding:16px}main{max-width:560px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.title{font-weight:800;font-size:1.1rem}.sub{font-size:.78rem;color:var(--muted);margin-top:4px}.btn{width:100%;padding:13px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;margin-top:8px}.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{padding:10px;border-radius:8px;background:#efeee9;font-size:.82rem;margin-top:8px}.ok{background:#e7f1eb;color:var(--ok)}.warn{background:#f5eedd;color:var(--warn)}.bad{background:#f7e7e3;color:var(--bad)}input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:1rem}label{display:block;font-size:.72rem;color:var(--muted);margin:8px 0 4px}video{width:100%;border-radius:10px;background:#111;margin-top:10px}pre{white-space:pre-wrap;word-break:break-word;background:#f1f0eb;border-radius:8px;padding:10px;max-height:220px;overflow:auto;font-size:.75rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{padding:8px;border:1px solid var(--line);border-radius:8px;background:#faf9f6}.field small{display:block;color:var(--muted);font-size:.68rem}.field b{font-size:.88rem}.hidden{display:none!important}.latency{font-size:1.5rem;font-weight:800}.tiny{font-size:.72rem;color:var(--muted)}
</style>
</head>
<body><main>
<div class="card"><div class="title">V26 Google OCR 속도 테스트</div><div class="sub">Tesseract 없음 · 바코드 없음 · 저장/DB 변경 없음</div><div id="sessionStatus" class="status">로그인 상태 확인 중...</div></div>
<div id="loginCard" class="card hidden"><div class="title">로그인</div><label>사번</label><input id="emp" autocomplete="username"><label>PIN 6자리</label><input id="pin" type="password" inputmode="numeric" maxlength="6"><button class="btn primary" id="loginBtn">로그인</button><div id="loginStatus" class="status">기존 공병 시스템 계정을 사용합니다.</div></div>
<div class="card"><div class="row"><button id="startBtn" class="btn primary">카메라 시작</button><button id="stopBtn" class="btn">카메라 중지</button></div><video id="video" playsinline muted></video><div class="row"><button id="liveBtn" class="btn primary">실시간 OCR 시작</button><button id="shotBtn" class="btn">현재 화면 1회 인식</button></div><div id="ocrStatus" class="status">카메라를 시작하세요.</div></div>
<div class="card"><div class="tiny">최근 OCR 처리시간</div><div id="latency" class="latency">-</div><div class="grid" id="fields"></div></div>
<div class="card"><div class="title">OCR 원문</div><pre id="raw">아직 인식 결과가 없습니다.</pre></div>
</main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbw6cRBWwrtwBiTlY6SShBRs5tFPaGwYio2xn7d3ebrBX2Eru4bNogFTiL8MM2IJ1SmUaw/exec';
const STORE='emptyBottle.v24.session';
const $=id=>document.getElementById(id);
let session=null,stream=null,live=false,busy=false;
function setStatus(id,text,type=''){const el=$(id);el.textContent=text;el.className='status'+(type?' '+type:'')}
function stored(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x&&x.session&&Number(x.expiresAt)>Date.now()+5000)return x}catch(e){}return null}
async function post(action,payload,useSession=true){const body={action,payload:payload||{}};if(useSession&&session)body.session=session.session;const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});const t=await r.text();try{return JSON.parse(t)}catch(e){throw new Error('서버 응답 해석 실패: '+t.slice(0,120))}}
async function verify(){session=stored();if(!session){$('loginCard').classList.remove('hidden');setStatus('sessionStatus','로그인이 필요합니다.','warn');return}try{const q=new URLSearchParams({action:'whoami',session:session.session});const r=await fetch(API_URL+'?'+q);const x=await r.json();if(!x.ok)throw new Error(x.message||'세션 만료');session.user=x.user||session.user;setStatus('sessionStatus','로그인됨 · '+((session.user&&session.user.name)||'사용자'),'ok')}catch(e){session=null;$('loginCard').classList.remove('hidden');setStatus('sessionStatus','세션이 만료되었습니다. 다시 로그인하세요.','warn')}}
$('loginBtn').onclick=async()=>{const employeeNo=$('emp').value.trim(),pin=$('pin').value.trim();if(!employeeNo||!/^[0-9]{6}$/.test(pin)){setStatus('loginStatus','사번과 PIN 6자리를 입력하세요.','bad');return}setStatus('loginStatus','로그인 중...','warn');try{const x=await post('authLogin',{employeeNo,pin},false);if(!x.ok)throw new Error(x.message||'로그인 실패');session={session:x.session,expiresAt:x.expiresAt,user:x.user,role:(x.user&&x.user.role)||'worker'};localStorage.setItem(STORE,JSON.stringify(session));$('loginCard').classList.add('hidden');setStatus('sessionStatus','로그인됨 · '+((x.user&&x.user.name)||employeeNo),'ok')}catch(e){setStatus('loginStatus','로그인 실패 · '+e.message,'bad')}};
async function startCamera(){if(stream)return;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});$('video').srcObject=stream;await $('video').play();setStatus('ocrStatus','카메라 준비 완료 · 라벨을 화면 중앙에 크게 맞추세요.','ok')}catch(e){setStatus('ocrStatus','카메라 실행 실패 · '+e.message,'bad')}}
function stopCamera(){live=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null;setStatus('ocrStatus','카메라 중지됨.')}
function capture(maxSide=1500,q=.8){const v=$('video');if(!v.videoWidth)return'';const sx=Math.round(v.videoWidth*.05),sy=Math.round(v.videoHeight*.10),sw=Math.round(v.videoWidth*.90),sh=Math.round(v.videoHeight*.80);const scale=Math.min(1,maxSide/Math.max(sw,sh));const c=document.createElement('canvas');c.width=Math.round(sw*scale);c.height=Math.round(sh*scale);c.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
function parse(text){const f=(r)=>{const m=text.match(r);return m&&m[1]?m[1].trim():''};return{입고번호:f(/입고\s*번호\s*[:：]?\s*(\d{6,12})/i),품명:f(/품\s*명\s*[:：]?\s*([^\n\r]+)/),품목코드:f(/품목\s*코드\s*[:：]?\s*([A-Z0-9-]{4,20})/i),수량:f(/(?:수량|수)\s*[:：]?\s*([0-9,]+(?:\.[0-9]+)?\s*(?:EA|개)?)/i),공급업체:f(/공급\s*업체\s*[:：]?\s*([^\n\r]+)/),입고일자:f(/입고\s*일자\s*[:：]?\s*(20\d{6}|20\d{2}[-./]\d{1,2}[-./]\d{1,2})/),사용기한:f(/사용\s*기한\s*[:：]?\s*(20\d{2}[-./]\d{1,2}[-./]\d{1,2})/),용기번호:f(/용기\s*번호\s*[:：]?\s*([0-9]{1,5}(?:\s*\/\s*[0-9]{1,5})?)/)}}
function renderFields(p){$('fields').innerHTML=Object.entries(p).map(([k,v])=>'<div class="field"><small>'+k+'</small><b>'+(v||'-')+'</b></div>').join('')}
async function ocrOnce(liveMode=false){if(busy)return;const data=capture(liveMode?1400:2200,liveMode?.78:.88);if(!data)return;busy=true;const started=performance.now();setStatus('ocrStatus',liveMode?'실시간 Google OCR 처리 중...':'Google OCR 처리 중...','warn');try{const x=await post('ocr',{image:data,source:'v26-test',live:!!liveMode},true);const ms=Math.round(performance.now()-started);$('latency').textContent=ms.toLocaleString()+' ms';if(!x||!x.ok)throw new Error((x&&x.message)||'OCR 실패');const text=String(x.text||'').trim();if(!text)throw new Error('글자를 찾지 못했습니다.');$('raw').textContent=text;renderFields(parse(text));setStatus('ocrStatus','Google OCR 완료 · '+ms.toLocaleString()+'ms','ok')}catch(e){const ms=Math.round(performance.now()-started);$('latency').textContent=ms.toLocaleString()+' ms';setStatus('ocrStatus','Google OCR 실패 · '+e.message,'bad')}finally{busy=false}}
async function liveLoop(){while(live){await ocrOnce(true);if(!live)break;await new Promise(r=>setTimeout(r,450))}}
$('startBtn').onclick=startCamera;$('stopBtn').onclick=stopCamera;$('shotBtn').onclick=()=>ocrOnce(false);$('liveBtn').onclick=async()=>{if(!stream)await startCamera();if(live){live=false;$('liveBtn').textContent='실시간 OCR 시작';setStatus('ocrStatus','실시간 OCR 중지됨.');return}live=true;$('liveBtn').textContent='실시간 OCR 중지';liveLoop()};
verify();
</script></body></html>
